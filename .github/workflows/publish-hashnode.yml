name: Publish posts to Hashnode

on:
  push:
    paths:
      - '_posts/**'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

      - name: Verify Hashnode secrets
        env:
          HASHNODE_TOKEN: ${{ secrets.HASHNODE_TOKEN }}
          HASHNODE_PUBLICATION_ID: ${{ secrets.HASHNODE_PUBLICATION_ID }}
        run: |
          if [ -n "$HASHNODE_TOKEN" ]; then echo "HASHNODE_TOKEN is configured"; else echo "HASHNODE_TOKEN is missing"; fi
          if [ -n "$HASHNODE_PUBLICATION_ID" ]; then echo "HASHNODE_PUBLICATION_ID is configured"; else echo "HASHNODE_PUBLICATION_ID is missing"; fi

      - name: Publish posts
        env:
          HASHNODE_TOKEN: ${{ secrets.HASHNODE_TOKEN }}
          HASHNODE_PUBLICATION_ID: ${{ secrets.HASHNODE_PUBLICATION_ID }}
        run: |
          python scripts/publish_hashnode.py

      - name: Upload platform artifacts
        uses: actions/upload-artifact@v4
        with:
          name: platform-export-artifacts
          path: |
            artifacts/*
            .hashnode-state.json
          if-no-files-found: warn
